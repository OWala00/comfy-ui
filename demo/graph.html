<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>comfy UI</title>
  <link rel="stylesheet" href="../src/ui/styles/graph.css">
  <style>
    #app {
      position: relative;
      width: 1024px;
      height: 576px;
    }
    .node {
      cursor: grab;
    }
    .node.dragging {
      cursor: grabbing;
    }
    .job {
      position: absolute;
      left: 280px;
      bottom: 12px;
      width: 300px;
      box-sizing: border-box;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #000000;
      border-radius: 6px;
      color: #dddddd;
      font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .job h2 {
      margin: 0 0 8px;
      font-size: 13px;
    }
    .job label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .job input {
      width: 70px;
      background: #353535;
      color: #dddddd;
      border: 1px solid #000000;
      border-radius: 4px;
      padding: 4px;
    }
    .job button {
      background: #353535;
      color: #dddddd;
      border: 1px solid #000000;
      border-radius: 4px;
      padding: 5px 12px;
      margin-right: 6px;
      cursor: pointer;
    }
    .job button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .bar {
      height: 8px;
      margin: 10px 0 6px;
      background: #1e1e1e;
      border: 1px solid #000000;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #4fc1ff;
    }
    .status {
      min-height: 16px;
      color: #9aa0a6;
    }
    .note {
      margin-top: 8px;
      color: #7d8590;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { Graph } from '../src/ui/components/Graph.js';
    import { createNode } from '../src/nodes/createNode.js';
    import { createTimerStop } from '../src/nodes/TimerStop.js';

    const nodes = [
      createNode('input', { id: 'first', x: 40, y: 80, title: 'First name' }),
      createNode('input', { id: 'last', x: 40, y: 200, title: 'Last name' }),
      createNode('concatenate', { id: 'join', x: 300, y: 120 }),
      createNode('delay', { id: 'wait', x: 560, y: 120 }),
      createNode('output', { id: 'display', x: 800, y: 80, title: 'Display' }),
      createNode('logger', { id: 'log', x: 560, y: 260 }),
      createNode('output', { id: 'sink', x: 800, y: 240, title: 'Log output' }),
      createNode('timerStop', { id: 'timer', x: 40, y: 400 }),
    ];

    const links = [
      { from: { node: 'first', slot: 0 }, to: { node: 'join', slot: 0 }, type: 'STRING' },
      { from: { node: 'last', slot: 0 }, to: { node: 'join', slot: 1 }, type: 'STRING' },
      { from: { node: 'join', slot: 0 }, to: { node: 'wait', slot: 0 }, type: 'STRING' },
      { from: { node: 'wait', slot: 0 }, to: { node: 'display', slot: 0 }, type: 'STRING' },
      { from: { node: 'wait', slot: 0 }, to: { node: 'log', slot: 0 }, type: 'STRING' },
      { from: { node: 'log', slot: 0 }, to: { node: 'sink', slot: 0 }, type: 'STRING' },
    ];

    const app = document.getElementById('app');
    app.appendChild(Graph({ width: 1024, height: 576, nodes, links }));

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Drag from a dot to another dot of the same type. Double-click a node to edit it. Right-click a link to remove it.';
    app.appendChild(hint);

    const panel = document.createElement('div');
    panel.className = 'job';
    panel.innerHTML = `
      <h2>Simulated job</h2>
      <label>Stop after (seconds)
        <input id="seconds" type="number" min="1" max="60" value="5">
      </label>
      <div>
        <button id="start">Start</button>
        <button id="cancel" disabled>Cancel</button>
      </div>
      <div class="bar"><i id="fill"></i></div>
      <div class="status" id="status">Idle</div>
      <div class="note">A placeholder job. Timer Stop calls its stop function here, not ComfyUI.</div>
    `;
    app.appendChild(panel);

    const secondsInput = panel.querySelector('#seconds');
    const startButton = panel.querySelector('#start');
    const cancelButton = panel.querySelector('#cancel');
    const fill = panel.querySelector('#fill');
    const status = panel.querySelector('#status');

    let timer = null;
    let ticker = null;
    let startedAt = 0;
    let duration = 0;

    function finish(text) {
      clearInterval(ticker);
      ticker = null;
      startButton.disabled = false;
      cancelButton.disabled = true;
      status.textContent = text;
    }

    function tick() {
      const elapsed = (Date.now() - startedAt) / 1000;
      const ratio = Math.min(elapsed / duration, 1);
      fill.style.width = `${(ratio * 100).toFixed(1)}%`;
      status.textContent = `Running ${elapsed.toFixed(1)}s of ${duration}s`;
    }

    startButton.addEventListener('click', () => {
      duration = Number(secondsInput.value);
      if (!(duration >= 1 && duration <= 60)) {
        status.textContent = 'Enter 1 to 60 seconds';
        return;
      }
      startedAt = Date.now();
      fill.style.width = '0%';
      startButton.disabled = true;
      cancelButton.disabled = false;
      timer = createTimerStop({
        seconds: duration,
        onStop: () => {
          fill.style.width = '100%';
          finish(`Stopped by Timer Stop after ${duration}s`);
        },
      });
      ticker = setInterval(tick, 100);
      tick();
      timer.start();
    });

    cancelButton.addEventListener('click', () => {
      timer.cancel();
      finish('Cancelled');
    });
  </script>
</body>
</html>
